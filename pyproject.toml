[build-system]
# 77 is the first release that reads a license expression and license-files.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shell-tools"
version = "8.1.0"
description = "Workstation tools for AI assistants, as a Python library and an MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ulrich Cuber", email = "sonstige@uc-it.de" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "shell",
    "filesystem",
    "tools",
    "workstation",
    "oauth",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: System :: Shells",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
server = ["mcp>=2,<3"]
dev = ["pytest", "ruff", "pylint", "build", "twine", "mcp>=2,<3"]

[project.scripts]
mcp-shell-tools = "mcp_shell_tools.server.app:main"

[project.urls]
Homepage = "https://www.uc-it.de"
Repository = "https://github.com/cuber-it/mcp-shell-tools"
Documentation = "https://github.com/cuber-it/mcp-shell-tools/tree/master/doc"
Changelog = "https://github.com/cuber-it/mcp-shell-tools/blob/master/CHANGES.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C90", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pep8-naming]
# http.server dispatches to handler methods by the HTTP verb, in capitals.
extend-ignore-names = ["do_POST"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mcp".msg = "Only mcp_shell_tools.server.app may import the SDK."

[tool.ruff.lint.per-file-ignores]
"src/mcp_shell_tools/server/app.py" = ["TID251"]
# These tests check the SDK binding the way an SDK client and caller meet it.
"tests/test_server.py" = ["TID251"]
"tests/test_server_client.py" = ["TID251"]
# Test names carry the sentence; a docstring would only repeat them.
"tests/*" = ["D103"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
# A token check and the SDK's verifier each answer exactly one question.
min-public-methods = 1
# find_replace takes what it replaces, where to look, and whether to write.
# Folding those into an object would hide the signature the caller reads.
max-args = 6

[tool.pylint.basic]
# http.server dispatches to handler methods by the HTTP verb, in capitals.
good-names-rgxs = ["^do_[A-Z]+$"]
# Test names carry the sentence; a docstring would only repeat them.
no-docstring-rgx = "^test_"

[tool.pylint."messages control"]
# A pytest fixture is used under its own name by design.
disable = ["redefined-outer-name"]

[tool.pytest.ini_options]
testpaths = ["tests"]
